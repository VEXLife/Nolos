  /* ------------------------------------------------------------ result UI -- */

  function showResultBanner(winner, reason) {
    els.resultBanner.dataset.winner = winner;
    if (winner === 'you') {
      els.resultTitle.textContent = '你赢啦！';
      els.resultSub.textContent = '小终回去补谱，再来一局？';
    } else if (winner === 'engine') {
      els.resultTitle.textContent = reason === 'resign' ? '小终收下这一胜' : '小终赢啦';
      els.resultSub.textContent = reason === 'resign' ? '认输也是策略，再来一局吧～' : '黑棋必胜，不是说说而已。';
    } else {
      els.resultTitle.textContent = '握手言和';
      els.resultSub.textContent = '棋盘满了，这局谁也没赢。';
    }
    els.resultBanner.hidden = false;
  }

  function hideResultBanner() {
    els.resultBanner.hidden = true;
  }

  /* --------------------------------------------------------------- fatal --- */

  function showFatal(message) {
    if (state.fatalShown) return;
    state.fatalShown = true;
    state.phase = 'error';
    state.busy = false;
    if (state.thinkTimer) {
      clearInterval(state.thinkTimer);
      state.thinkTimer = null;
    }
    if (loadTimer) {
      clearInterval(loadTimer);
      loadTimer = null;
    }
    updateControls();
    updateStatus();
    updateTurnUI();
    const safe = escapeHtml(message || '未知错误');
    const fileHint = location.protocol === 'file:'
      ? '如果浏览器限制了 file:// 下的 Worker，请在仓库根目录运行 <code>python3 -m http.server</code> 后访问。'
      : '刷新页面通常能解决。';
    const loadingVisible = els.loading && !els.loading.hidden && !els.loading.classList.contains('done');
    if (loadingVisible) {
      els.loading.classList.remove('done');
      els.loading.hidden = false;
      els.loadingCard.classList.add('error');
      els.loadingCard.innerHTML = `
        <div class="loading-mascot" aria-hidden="true" style="font-size:52px;line-height:1">×_×</div>
        <h2>小终打了个喷嚏…</h2>
        <p>引擎没有成功启动。${fileHint}</p>
        <pre class="error-detail">${safe}</pre>
        <button class="btn primary" id="retryBtn" type="button" style="margin-top:14px">刷新页面重试</button>`;
      const retry = document.getElementById('retryBtn');
      if (retry) retry.addEventListener('click', () => location.reload());
    } else {
      openModal({
        title: '小终打了个喷嚏…',
        body: `<p>引擎在运行中出了问题。${fileHint}</p><pre class="error-detail" style="margin-top:10px">${safe}</pre>`,
        actions: [
          { label: '关闭', action: 'close', kind: 'ghost' },
          { label: '刷新页面', action: 'reload', kind: 'primary' },
        ],
        onAction: (action) => {
          if (action === 'reload') location.reload();
          else closeModal();
        },
        onCancel: () => {},
      });
    }
  }

  window.__onEngineFatal = (message) => {
    if (!state.fatalShown) showFatal(message);
  };

  /* --------------------------------------------------------------- loading -- */

  function startLoadingProgress() {
    loadProgress = 0;
    if (loadTimer) clearInterval(loadTimer);
    loadTimer = setInterval(() => {
      loadProgress = Math.min(88, loadProgress + 6 + Math.random() * 9);
      if (els.loadBar) els.loadBar.style.width = `${loadProgress}%`;
    }, 130);
  }

  async function finishLoading() {
    if (loadTimer) {
      clearInterval(loadTimer);
      loadTimer = null;
    }
    if (els.loadBar) els.loadBar.style.width = '100%';
    await delay(260);
    if (state.fatalShown) return;
    els.loading.classList.add('done');
    setTimeout(() => {
      if (!state.fatalShown) els.loading.hidden = true;
    }, 460);
  }

  /* ------------------------------------------------------------- confetti -- */

  function burstConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = els.confetti;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#ff6b6b', '#ffd166', '#9be7cf', '#6cb6ff', '#b197fc', '#ffa94d', '#fffdf7'];
    for (let i = 0; i < 130; i += 1) {
      const fromLeft = i % 2 === 0;
      confettiParticles.push({
        x: fromLeft ? 30 + Math.random() * 90 : w - 120 + Math.random() * 90,
        y: h - 30 - Math.random() * 40,
        vx: (fromLeft ? 1 : -1) * (2.2 + Math.random() * 4.4),
        vy: -(7.5 + Math.random() * 7),
        g: 0.22 + Math.random() * 0.09,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.25,
        size: 5 + Math.random() * 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: Math.random() < 0.32 ? 'circle' : 'rect',
        life: 0,
      });
    }
    if (!confettiRaf) confettiRaf = requestAnimationFrame(tickConfetti);
  }

  function tickConfetti() {
    const canvas = els.confetti;
    const ctx = canvas.getContext('2d');
    if (!ctx) { confettiRaf = 0; return; }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    for (let i = confettiParticles.length - 1; i >= 0; i -= 1) {
      const p = confettiParticles[i];
      p.life += 1;
      p.vy += p.g;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > h + 60 || p.life > 260) {
        confettiParticles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, (260 - p.life) / 60);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.42, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    }
    if (confettiParticles.length) {
      confettiRaf = requestAnimationFrame(tickConfetti);
    } else {
      confettiRaf = 0;
      ctx.clearRect(0, 0, w, h);
    }
  }

  /* --------------------------------------------------------------- events -- */

  function focusCell(x, y) {
    if (!inBounds(x, y)) return;
    const cell = cellEls[y][x];
    if (cell) cell.focus();
  }

  function bindEvents() {
    els.cellLayer.addEventListener('click', (event) => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      const x = Number(cell.dataset.x);
      const y = Number(cell.dataset.y);
      humanPlay(x, y);
    });

    els.cellLayer.addEventListener('keydown', (event) => {
      const cell = event.target.closest('.cell');
      if (!cell) return;
      const x = Number(cell.dataset.x);
      const y = Number(cell.dataset.y);
      const moves = {
        ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
      };
      if (moves[event.key]) {
        event.preventDefault();
        focusCell(x + moves[event.key][0], y + moves[event.key][1]);
      }
    });

    els.newGameBtn.addEventListener('click', askNewGame);
    els.undoBtn.addEventListener('click', undoFlow);
    els.resignBtn.addEventListener('click', resignFlow);
    els.resultAgain.addEventListener('click', () => {
      hideResultBanner();
      beginNewGame();
    });
    els.resultClose.addEventListener('click', hideResultBanner);

    for (const btn of $$('.segmented button')) {
      btn.addEventListener('click', () => setLevel(btn.dataset.level));
    }

    els.soundBtn.addEventListener('click', toggleSound);
    els.aboutBtn.addEventListener('click', openAbout);

    els.modalClose.addEventListener('click', () => closeModal());
    els.modalBackdrop.addEventListener('click', (event) => {
      if (event.target === els.modalBackdrop) closeModal();
    });
    els.modalBody.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      if (modalState.onAction) modalState.onAction(btn.dataset.action);
    });

    document.addEventListener('keydown', (event) => {
      if (els.modalBackdrop.hidden) return;
      if (event.key === 'Escape') {
        closeModal();
        return;
      }
      if (event.key === 'Tab') {
        const focusables = $$('button:not(:disabled), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', els.modal)
          .filter((el) => el.offsetParent !== null);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    document.addEventListener('pointerdown', () => {
      audioUnlocked = true;
      ensureAudio();
    }, { once: true });

    document.addEventListener('click', (event) => {
      const btn = event.target.closest('button');
      if (btn && !btn.classList.contains('cell') && !btn.disabled) playSound('tap');
    });

    window.addEventListener('resize', () => {
      if (confettiParticles.length) {
        const canvas = els.confetti;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
      }
    });

    window.addEventListener('beforeunload', () => engine.terminate());
  }

  /* ---------------------------------------------------------------- debug -- */

  function exposeDebug() {
    let params;
    try { params = new URLSearchParams(location.search); } catch (_) { params = null; }
    if (!params || !params.has('debug')) return;
    window.__terminator = {
      getState: () => ({
        board: Array.from(state.board),
        moves: state.moves.map((m) => ({ ...m })),
        turn: state.turn,
        phase: state.phase,
        busy: state.busy,
        result: state.result ? { ...state.result } : null,
        score: { ...state.score },
        level: state.level,
        stats: { ...state.stats },
        source: state.source,
      }),
      click: (x, y) => {
        const cell = cellEls[y] && cellEls[y][x];
        if (cell) cell.click();
      },
      newGame: () => beginNewGame(),
      forceResult: (winner = 'you') => endGame(winner, null, 'debug'),
      engine,
    };
  }

  /* ----------------------------------------------------------------- boot -- */

  async function boot() {
    if (typeof WebAssembly === 'undefined' || typeof Worker === 'undefined' || typeof Blob === 'undefined') {
      showFatal('当前浏览器不支持 WebAssembly / Web Worker。请换用较新的 Chrome、Edge、Firefox 或 Safari。');
      return;
    }
    buildBoard();
    bindEvents();
    updateSoundButton();
    updateLevelUI();
    updateScoreDisplay();
    updateLastMarker();
    updateSourceIdle();
    updateTurnUI();
    updateStatus();
    updateControls();
    exposeDebug();
    startLoadingProgress();

    try {
      await engine.start();
      await engine.run(configCommands());
      await beginNewGame({ initial: true });
      await finishLoading();
    } catch (err) {
      showFatal(err && err.message ? err.message : String(err));
    }
  }

  function updateSourceIdle() {
    state.source = 'idle';
    els.sourcePill.textContent = SOURCE_META.idle.label;
    els.sourcePill.dataset.source = 'idle';
    els.lastDetail.textContent = SOURCE_META.idle.detail;
    els.lastTime.textContent = '';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
