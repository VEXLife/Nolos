<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff7e6'/%3E%3Ccircle cx='32' cy='35' r='21' fill='%2325212f' stroke='%2317141f' stroke-width='3'/%3E%3Ccircle cx='25' cy='33' r='4.2' fill='%23fff'/%3E%3Ccircle cx='39' cy='33' r='4.2' fill='%23fff'/%3E%3Cpath d='M27 43 Q32 47 37 43' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Nolos五子棋[终] · Nolos Gomoku</title>
<meta name="description" content="Nolos五子棋[终]：一个跑在浏览器里的五子棋独立复现。27 行开局书 + 6,543 条安静手骨架 + 运行时 VCF/VCT。纯静态、无后端。">
<style>
/* ==========================================================================
   五子棋终结者 · Web 版
   Cartoon UI: paper cards, chunky ink outlines, a very round little monster.
   ========================================================================== */

:root {
  --ink: #2b2638;
  --ink-soft: #5a536b;
  --paper: #fffaf0;
  --paper-2: #fff3dc;
  --coral: #ff6b6b;
  --coral-deep: #e94f5b;
  --sun: #ffd166;
  --sun-deep: #ffb703;
  --mint: #9be7cf;
  --mint-deep: #3fbf9a;
  --sky: #bfe9ff;
  --blue: #6cb6ff;
  --purple: #b197fc;
  --orange: #ffa94d;
  --wood-1: #f8d99f;
  --wood-2: #f2c47e;
  --wood-3: #e3a85b;
  --line: rgba(143, 94, 42, .55);
  --radius: 26px;
  --shadow-card: 0 7px 0 var(--ink), 0 18px 34px rgba(43, 38, 56, .17);
  --font-round: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --font-mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  font-family: var(--font-round);
  background:
    radial-gradient(circle at 82% 10%, rgba(255, 255, 255, .62), transparent 32%),
    linear-gradient(180deg, #bfe9ff 0%, #ddf5ff 36%, #f2fbef 64%, #fff6e6 100%);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: .45;
  background-image: radial-gradient(rgba(43, 38, 56, .055) 1px, transparent 1.5px);
  background-size: 18px 18px;
  mix-blend-mode: multiply;
}

button { font-family: inherit; }

[hidden] { display: none !important; }

/* ---------------------------------------------------------------- scene -- */

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.sun {
  position: absolute;
  top: 5.5%;
  right: 7%;
  width: 108px;
  height: 108px;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #fff6b3, #ffd166 54%, #ffb703 100%);
  box-shadow:
    0 0 0 13px rgba(255, 209, 102, .22),
    0 0 0 26px rgba(255, 209, 102, .1),
    0 0 70px rgba(255, 183, 3, .5);
  animation: sun-breathe 6s ease-in-out infinite;
}

.cloud {
  position: absolute;
  width: 128px;
  height: 40px;
  border-radius: 999px;
  background: #fff;
  opacity: .78;
  filter: drop-shadow(0 8px 14px rgba(96, 150, 180, .08));
  animation: cloud-drift 64s linear infinite;
}
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: #fff;
}
.cloud::before { width: 58px; height: 58px; left: 18px; top: -27px; }
.cloud::after  { width: 42px; height: 42px; right: 22px; top: -18px; }
.cloud-1 { top: 16%; left: -160px; --s: 1; animation-delay: -8s; animation-duration: 58s; }
.cloud-2 { top: 29%; left: -240px; --s: .7; opacity: .62; animation-delay: -32s; animation-duration: 76s; }
.cloud-3 { top: 8%; left: 42%; --s: .54; opacity: .55; animation-delay: -48s; animation-duration: 92s; }
.cloud-4 { top: 39%; left: -220px; --s: .82; opacity: .5; animation-delay: -20s; animation-duration: 70s; animation-direction: reverse; }

.sparkle {
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--sun);
  clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
  opacity: .75;
  animation: twinkle 4.6s ease-in-out infinite;
}
.sparkle-1 { top: 21%; left: 8%; animation-delay: -1.2s; }
.sparkle-2 { top: 45%; right: 12%; width: 9px; height: 9px; animation-delay: -2.7s; }
.sparkle-3 { top: 12%; left: 58%; width: 8px; height: 8px; animation-delay: -3.4s; }

.hills {
  position: absolute;
  left: -2%;
  right: -2%;
  bottom: -2px;
  width: 104%;
  height: 34vh;
  min-height: 190px;
}
.hill-back  { fill: #cdeedd; opacity: .85; }
.hill-mid   { fill: #a8e2c8; opacity: .9; }
.hill-front { fill: #86d5b3; }

.grass-tuft {
  position: absolute;
  bottom: 2%;
  width: 54px;
  height: 28px;
  border-radius: 50% 50% 0 0;
  background: #6fc8a0;
  opacity: .55;
}
.grass-tuft::before,
.grass-tuft::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 22px;
  height: 46px;
  border-radius: 50% 50% 0 0;
  background: inherit;
}
.grass-tuft::before { left: 4px; transform: rotate(-12deg); }
.grass-tuft::after  { right: 4px; transform: rotate(12deg); }
.grass-1 { left: 4%; transform: scale(.9); }
.grass-2 { right: 6%; transform: scale(1.15); }
.grass-3 { left: 28%; bottom: -1%; transform: scale(.6); opacity: .4; }

/* --------------------------------------------------------------- header -- */

.topbar {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 24px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  width: 56px;
  height: 56px;
  flex: 0 0 auto;
  border-radius: 18px;
  background: #fffdf7;
  border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  display: grid;
  place-items: center;
  transform: rotate(-3deg);
  transition: transform .25s cubic-bezier(.2, 1.4, .4, 1);
}
.brand:hover .brand-mark { transform: rotate(4deg) scale(1.04); }
.brand-mark svg { width: 44px; height: 44px; }

.brand-text { min-width: 0; }
.brand-text h1 {
  position: relative;
  display: inline-block;
  margin: 0;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: .02em;
  line-height: 1.14;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .75);
}
.brand-text h1::after {
  content: "";
  position: absolute;
  left: 2px;
  right: 2px;
  bottom: 1px;
  height: 8px;
  border-radius: 99px;
  background: linear-gradient(90deg, rgba(255, 209, 102, .8), rgba(255, 107, 107, .4));
  z-index: -1;
  transform: rotate(-.6deg);
}
.brand-text p {
  margin: 5px 0 0;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .16em;
  color: var(--ink-soft);
  white-space: nowrap;
}
.brand-text p span { color: var(--coral-deep); }
.brand-text h1 .title-end { color: var(--coral-deep); }

.top-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
}

.scoreboard {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: #fffdf7;
  box-shadow: 0 3px 0 var(--ink);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.scoreboard .you { color: #138f84; }
.scoreboard .cpu { color: #e0525e; }
.scoreboard b { font-size: 15px; }
.scoreboard .colon { opacity: .35; }

.icon-btn {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  background: #fffdf7;
  box-shadow: 0 3px 0 var(--ink);
  color: var(--ink);
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .2s;
}
.icon-btn:hover { transform: translateY(-2px) rotate(-2deg); background: #fff3dc; }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn .icon-off { display: none; }
body.muted .icon-btn#soundBtn .icon-on { display: none; }
body.muted .icon-btn#soundBtn .icon-off { display: block; }

/* ---------------------------------------------------------------- cards -- */

.card {
  position: relative;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .55), transparent 38%),
    var(--paper);
  border: 3px solid var(--ink);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
}

.game-shell {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 356px;
  gap: 26px;
  align-items: start;
}

.board-card {
  width: fit-content;
  max-width: 100%;
  justify-self: center;
  padding: 16px 16px 12px;
  animation: rise-in .55s cubic-bezier(.2, .9, .3, 1) both;
}

.board-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.player-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 11px 4px 5px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: #fffdf7;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform .22s cubic-bezier(.2, 1.4, .4, 1), background .22s;
  flex: 0 0 auto;
}
.player-chip.active { transform: translateY(-2px) rotate(-1.2deg); background: #ffe6a8; }
.white-chip.active { background: #e5f8ff; }
.player-copy { display: flex; flex-direction: column; line-height: 1.05; }
.player-copy b { font-size: 13px; letter-spacing: .02em; }
.player-copy small { font-size: 9px; font-weight: 800; letter-spacing: .12em; opacity: .55; margin-top: 2px; }

.mini-stone {
  width: 29px;
  height: 29px;
  border-radius: 50%;
  border: 2px solid #17141f;
  background: radial-gradient(circle at 34% 27%, #6f6b82 0%, #2a2634 46%, #0e0c13 100%);
  box-shadow: inset 2px 2px 3px rgba(255, 255, 255, .25), 0 2px 3px rgba(0, 0, 0, .2);
}
.mini-stone.white {
  border-color: #c7a982;
  background: radial-gradient(circle at 34% 27%, #fffefb 0%, #f6e9d7 48%, #ddc5a9 100%);
  box-shadow: inset 2px 2px 3px rgba(255, 255, 255, .8), 0 2px 3px rgba(90, 70, 40, .16);
}

.status-wrap { flex: 1 1 auto; text-align: center; min-width: 0; }
.status {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-height: 20px;
}
.status-sub {
  margin-top: 3px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-soft);
  opacity: .68;
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.thinking-dots { display: inline-flex; gap: 3px; vertical-align: 2px; margin-left: 5px; }
.thinking-dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--coral);
  animation: dot-bounce .9s ease-in-out infinite;
}
.thinking-dots i:nth-child(2) { animation-delay: .14s; }
.thinking-dots i:nth-child(3) { animation-delay: .28s; }

/* ---------------------------------------------------------------- board -- */

.board-frame {
  position: relative;
  padding: 12px;
  border: 3px solid var(--ink);
  border-radius: 23px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, .5), transparent 38%),
    linear-gradient(145deg, var(--wood-1), var(--wood-2) 52%, var(--wood-3));
  box-shadow:
    inset 0 3px 0 rgba(255, 255, 255, .55),
    inset 0 -7px 0 rgba(145, 85, 26, .18),
    0 5px 0 var(--ink);
}

.board-shell {
  display: grid;
  grid-template-columns: 20px 1fr;
  grid-template-rows: 20px 1fr;
  width: min(700px, calc(100vw - 470px), 74vh);
  margin: 0 auto;
}

.corner-label {
  grid-area: 1 / 1;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: rgba(123, 78, 30, .65);
}
.col-labels {
  grid-area: 1 / 2;
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  align-items: center;
  justify-items: center;
  text-align: center;
  line-height: 1;
}
.row-labels {
  grid-area: 2 / 1;
  display: grid;
  grid-template-rows: repeat(15, 1fr);
  align-items: center;
  justify-items: center;
  text-align: center;
  line-height: 1;
}
.col-labels span,
.row-labels span {
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  font-size: 9px;
  font-weight: 800;
  color: rgba(123, 78, 30, .66);
  font-family: var(--font-mono);
  letter-spacing: .02em;
}

.board {
  grid-area: 2 / 2;
  position: relative;
  aspect-ratio: 1 / 1;
  border: 0;
  border-radius: 13px;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 12%, rgba(255, 255, 255, .5), transparent 32%),
    repeating-linear-gradient(92deg, rgba(150, 92, 32, .032) 0 1.5px, transparent 1.5px 13px),
    linear-gradient(135deg, #f9dda9, #f3c987 48%, #efbf74);
  box-shadow:
    inset 0 0 0 2px #b57f45,
    inset 0 0 38px rgba(122, 72, 18, .18),
    inset 0 2px 0 rgba(255, 255, 255, .55);
  touch-action: manipulation;
  user-select: none;
}
.board.busy { cursor: progress; }
.board.over { cursor: default; }

.grid-lines { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.gl { position: absolute; background: var(--line); }
.gl.v { top: 3.3333%; height: 93.3334%; width: 1.5px; transform: translateX(-50%); }
.gl.h { left: 3.3333%; width: 93.3334%; height: 1.5px; transform: translateY(-50%); }

.star-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.star {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(132, 85, 34, .62);
  transform: translate(-50%, -50%);
}

.stone-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

.stone {
  position: absolute;
  width: calc(100% / 15 * .82);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.stone::before {
  content: "";
  position: absolute;
  left: 21%;
  top: 15%;
  width: 30%;
  height: 21%;
  border-radius: 50%;
  background: #fff;
  opacity: .5;
  transform: rotate(-28deg);
  filter: blur(.4px);
}
.stone.black {
  background: radial-gradient(circle at 33% 26%, #77738b 0%, #34303f 34%, #17141f 70%, #08070b 100%);
  border: 1.5px solid #08070b;
  box-shadow:
    0 3px 5px rgba(0, 0, 0, .32),
    inset -2px -3px 5px rgba(0, 0, 0, .48),
    inset 2px 2px 4px rgba(255, 255, 255, .12);
}
.stone.black::before { opacity: .24; }
.stone.white {
  background: radial-gradient(circle at 33% 26%, #fffefb 0%, #fbf1e2 42%, #e5d0b5 78%, #cdb08d 100%);
  border: 1.5px solid #b3946f;
  box-shadow:
    0 3px 5px rgba(90, 70, 40, .26),
    inset -2px -3px 4px rgba(155, 122, 82, .25),
    inset 2px 2px 4px #fff;
}
.stone.new { animation: stone-drop .32s cubic-bezier(.2, 1.5, .4, 1) both; }

.stone.last::after {
  content: "";
  position: absolute;
  inset: -17%;
  border-radius: 50%;
  border: 2.5px solid #ff5a5f;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .5);
  animation: last-pulse 1.8s ease-in-out infinite;
}
.stone.winning {
  filter: drop-shadow(0 0 7px rgba(255, 209, 102, .98));
}
.stone.winning::after {
  content: "";
  position: absolute;
  inset: -10%;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .8);
}

.win-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease;
}
.win-layer.show { opacity: 1; }
#winLine {
  stroke: #ff4f7b;
  stroke-width: .22;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  filter: drop-shadow(0 0 3px rgba(255, 79, 123, .85));
}
.win-layer.show #winLine { animation: draw-line .6s .06s ease forwards; }

.cell-layer {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  grid-template-rows: repeat(15, 1fr);
}
.cell {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 5px;
  -webkit-tap-highlight-color: transparent;
}
.board.busy .cell,
.board.over .cell { cursor: default; }
.cell::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 74%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: radial-gradient(circle at 33% 27%, #fffefb 0%, #f8ecdc 52%, #dec7aa 100%);
  box-shadow: 0 2px 4px rgba(90, 70, 40, .2);
  opacity: 0;
  transform: translate(-50%, -50%) scale(.55);
  transition: opacity .14s ease, transform .14s cubic-bezier(.2, 1.4, .4, 1);
  pointer-events: none;
  z-index: 1;
}
.board[data-turn="w"]:not(.busy):not(.over) .cell:not(.occupied):hover::after,
.board[data-turn="w"]:not(.busy):not(.over) .cell:not(.occupied):focus-visible::after {
  opacity: .42;
  transform: translate(-50%, -50%) scale(1);
}
.cell:focus-visible {
  outline: 3px solid #ff8a5c;
  outline-offset: -3px;
  z-index: 6;
}

.board-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 6px 0;
  font-size: 10.5px;
  color: var(--ink-soft);
}
.hint { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.hint-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff7a59;
  box-shadow: 0 0 0 3px rgba(255, 122, 89, .18);
}
.engine-meta {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .02em;
  opacity: .55;
  white-space: nowrap;
}

/* ------------------------------------------------------------ side panel -- */

.side {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  animation: rise-in .55s .08s cubic-bezier(.2, .9, .3, 1) both;
}

.mascot-card { padding: 14px 16px 12px; overflow: hidden; }
.mascot-card::before {
  content: "";
  position: absolute;
  right: -44px;
  top: -52px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 209, 102, .38), transparent 70%);
  pointer-events: none;
}

.speech {
  position: relative;
  z-index: 2;
  min-height: 46px;
  padding: 9px 12px;
  border: 2.5px solid var(--ink);
  border-radius: 16px;
  background: #fffdf7;
  box-shadow: 0 3px 0 var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.5;
}
.speech::after {
  content: "";
  position: absolute;
  left: 29px;
  bottom: -9px;
  width: 14px;
  height: 14px;
  background: #fffdf7;
  border-right: 2.5px solid var(--ink);
  border-bottom: 2.5px solid var(--ink);
  transform: rotate(45deg);
}
.speech.pop { animation: speech-pop .28s cubic-bezier(.2, 1.4, .4, 1); }

.mascot-stage {
  position: relative;
  height: 206px;
  margin-top: 2px;
  display: grid;
  place-items: center;
}
.mascot-glow {
  position: absolute;
  width: 184px;
  height: 184px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 209, 102, .34), rgba(255, 209, 102, 0) 68%);
  filter: blur(1px);
  animation: glow-breathe 3.6s ease-in-out infinite;
}
.mascot-svg {
  position: relative;
  width: 186px;
  height: 186px;
  filter: drop-shadow(0 10px 10px rgba(43, 38, 56, .18));
  overflow: visible;
}
.mascot-float {
  transform-box: fill-box;
  transform-origin: center;
  animation: mascot-float 4.2s ease-in-out infinite;
}

.eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 5.4s ease-in-out infinite;
}
.antenna-glow { transform-box: fill-box; transform-origin: center; }

.mascot-stage.thinking .mascot-float { animation: mascot-think .72s ease-in-out infinite; }
.mascot-stage.thinking .eye { animation: eye-look 1.1s ease-in-out infinite; }
.mascot-stage.thinking .antenna-glow { animation: antenna-glow 1.1s ease-in-out infinite; }
.mascot-stage.happy .mascot-float { animation: mascot-hop .62s ease-in-out infinite; }
.mascot-stage.happy .m-mouth { d: path("M104 150 Q120 172 136 150"); }
.mascot-stage.sad .mascot-svg { filter: grayscale(.35) drop-shadow(0 8px 8px rgba(43, 38, 56, .16)); }
.mascot-stage.sad .mascot-float { animation: mascot-sad 3s ease-in-out infinite; }
.mascot-stage.sad .m-mouth { d: path("M108 160 Q120 150 132 160"); }
.m-tear { transform-box: fill-box; transform-origin: center; opacity: 0; }
.mascot-stage.sad .m-tear { animation: tear-drop 2.1s ease-in-out infinite; }

.mascot-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px;
}
.mascot-name { display: flex; align-items: center; gap: 7px; font-size: 14px; }
.mascot-name b { font-size: 16px; letter-spacing: .02em; }
.mascot-name small {
  font-size: 8.5px;
  font-weight: 900;
  letter-spacing: .18em;
  color: var(--ink-soft);
  opacity: .55;
  margin-top: 2px;
}
.tiny-stone {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid #17141f;
  background: radial-gradient(circle at 34% 27%, #6f6b82, #17141f 70%);
}

.source-pill {
  padding: 4px 10px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #ece8df;
  box-shadow: 0 2px 0 var(--ink);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .03em;
  white-space: nowrap;
  transition: background .2s;
}
.source-pill[data-source="booktree"] { background: #b9f5d8; }
.source-pill[data-source="book"]     { background: #cfe8ff; }
.source-pill[data-source="plan"]     { background: #d7f0ff; }
.source-pill[data-source="vcf"],
.source-pill[data-source="vct"]      { background: #e3d5ff; }
.source-pill[data-source="fallback"] { background: #ffe0b3; }
.source-pill[data-source="five"],
.source-pill[data-source="block"]    { background: #ffc9c9; }
.source-pill[data-source="search"]   { background: #e4e0ea; }
.source-pill[data-source="thinking"] { background: #ffe9a8; }
.source-pill[data-source="human"]    { background: #d8ecff; }
.source-pill[data-source="center"]   { background: #ffe6c7; }
.source-pill.pulse { animation: pill-pop .35s cubic-bezier(.2, 1.5, .4, 1); }

.engine-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1.5px dashed rgba(43, 38, 56, .16);
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-soft);
  opacity: .66;
}
.engine-line span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.engine-line span:last-child { flex: 0 0 auto; }

/* ------------------------------------------------------------ play card -- */

.play-card { padding: 14px 16px 16px; }

.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  padding: 7px 4px 5px;
  border: 2px solid var(--ink);
  border-radius: 14px;
  background: #fffdf7;
  box-shadow: 0 2.5px 0 var(--ink);
  text-align: center;
}
.stat b { display: block; font-size: 19px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; font-weight: 800; color: var(--ink-soft); }

.difficulty { margin-top: 14px; }
.diff-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 2px;
  font-size: 11px;
  font-weight: 800;
}
.diff-label span:last-child { color: var(--ink-soft); opacity: .6; font-size: 10px; }
.segmented {
  display: flex;
  gap: 3px;
  margin-top: 7px;
  padding: 3px;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  background: #efe4d2;
  box-shadow: inset 0 2px 3px rgba(120, 90, 50, .12);
}
.segmented button {
  flex: 1 1 0;
  padding: 6px 8px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 800;
  cursor: pointer;
  transition: background .18s, box-shadow .18s, transform .18s;
}
.segmented button:hover { background: rgba(255, 255, 255, .5); }
.segmented button.on {
  background: #fffdf7;
  box-shadow: 0 2px 0 var(--ink), 0 1px 4px rgba(43, 38, 56, .12);
  transform: translateY(-1px);
}
.segmented button[data-level="easy"].on { background: #d8f8ec; }
.segmented button[data-level="normal"].on { background: #fff0b8; }
.segmented button[data-level="hard"].on { background: #ffd6cf; }

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.controls .primary { grid-column: 1 / -1; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 40px;
  padding: 8px 13px;
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  background: #fffdf7;
  color: var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: .02em;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.btn:hover:not(:disabled) { transform: translateY(-2px); background: #fff6e6; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled {
  opacity: .42;
  cursor: not-allowed;
  transform: none;
  box-shadow: 0 2px 0 var(--ink);
}
.btn.primary {
  background: linear-gradient(180deg, #ffd166, #ffb703);
  color: #38240b;
}
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffdb8a, #ffc233); }
.btn.ghost { background: #fff; }
.btn.danger { background: linear-gradient(180deg, #ff9b9b, #ff6b6b); color: #401014; }
.btn.danger:hover:not(:disabled) { background: linear-gradient(180deg, #ffb0b0, #ff7f7f); }
.btn.small { min-height: 34px; padding: 6px 11px; font-size: 11.5px; border-radius: 12px; }

/* ------------------------------------------------------------- move log -- */

.log-card {
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 4px 8px;
}
.log-head h3 { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .04em; }
.log-head span { font-size: 10px; font-weight: 700; color: var(--ink-soft); opacity: .6; }

.log-list {
  max-height: 196px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(43, 38, 56, .3) transparent;
}
.log-list::-webkit-scrollbar { width: 7px; }
.log-list::-webkit-scrollbar-thumb {
  background: rgba(43, 38, 56, .24);
  border-radius: 99px;
}
.log-row {
  display: grid;
  grid-template-columns: 24px 1fr 1fr;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 8px;
}
.log-row:nth-child(odd) { background: rgba(43, 38, 56, .035); }
.log-row .idx {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-soft);
  text-align: center;
  opacity: .65;
}
.log-move {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  min-width: 0;
}
.log-move .dot {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 1.5px solid #17141f;
}
.log-move.black .dot { background: #26212f; }
.log-move.white .dot { background: #fffdf7; border-color: #b3946f; }
.log-move .src-dot {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  margin-left: 3px;
  border-radius: 50%;
  background: #9b7bff;
  opacity: .9;
}
.log-move .src-dot.book { background: #2fae87; }
.log-move .src-dot.search { background: #ff9f43; }
.log-empty {
  padding: 26px 12px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 700;
  opacity: .62;
}

.foot-dot { opacity: .5; }

/* --------------------------------------------------------- result banner -- */

.result-banner {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 13px;
  width: max-content;
  max-width: min(700px, calc(100vw - 28px));
  padding: 11px 15px;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 21px;
  box-shadow: 0 6px 0 var(--ink), 0 20px 40px rgba(43, 38, 56, .22);
  animation: banner-in .42s cubic-bezier(.2, 1.35, .4, 1) both;
}
.result-badge { width: 48px; height: 48px; flex: 0 0 auto; }
.result-badge svg { width: 100%; height: 100%; }
.result-banner[data-winner="engine"] .result-badge svg circle:first-child { fill: #c8c1d6; }
.result-banner[data-winner="draw"] .result-badge svg circle:first-child { fill: #b9e6f8; }
.result-copy { min-width: 0; }
.result-copy h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: .02em; }
.result-copy p { margin: 2px 0 0; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
.result-actions { display: flex; gap: 7px; margin-left: auto; }

/* ----------------------------------------------------------------- modal -- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(35, 30, 50, .42);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .18s ease;
}
.modal-backdrop.show { opacity: 1; }
.modal {
  width: min(470px, 100%);
  max-height: min(84vh, 720px);
  overflow-y: auto;
  padding: 24px 24px 20px;
  transform: translateY(16px) scale(.96);
  opacity: 0;
  transition: transform .22s cubic-bezier(.2, 1.3, .4, 1), opacity .22s ease;
}
.modal-backdrop.show .modal { transform: none; opacity: 1; }
.modal h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .02em; }
.modal-copy { margin-top: 10px; font-size: 12.5px; line-height: 1.75; color: var(--ink-soft); }
.modal-copy p { margin: 0; }
.modal-copy p + p { margin-top: 8px; }
.modal-copy b { color: var(--ink); }
.modal-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}
.modal-close {
  position: absolute;
  top: 9px;
  right: 11px;
  width: 32px;
  height: 32px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: #fffdf7;
  box-shadow: 0 2px 0 var(--ink);
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  color: var(--ink);
}
.modal-close:hover { background: #ffe6e6; }

.about-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 2px solid var(--ink);
  border-radius: 15px;
  background: #fff4dc;
  margin-bottom: 12px;
}
.about-hero svg { width: 52px; height: 52px; flex: 0 0 auto; }
.about-hero b { display: block; font-size: 13px; }
.about-hero span { font-size: 11px; color: var(--ink-soft); }
.about-notice {
  margin-top: 12px;
  padding: 10px 12px;
  border: 2px solid #e0a04a;
  border-radius: 13px;
  background: #fff1d6;
}
.about-notice > b {
  display: block;
  margin-bottom: 5px;
  font-size: 12px;
  color: #9a5b12;
}
.about-notice p {
  margin: 0;
  font-size: 11px;
  line-height: 1.68;
  color: var(--ink-soft);
}
.about-notice p + p { margin-top: 6px; }
.about-notice b { color: var(--ink); }
.about-list {
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
}
.about-list li {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 11.5px;
  line-height: 1.55;
}
.about-list li::before {
  content: "";
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--sun-deep);
}
.about-code {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 5px;
  background: rgba(43, 38, 56, .07);
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.about-stats {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.about-stats span {
  flex: 1;
  padding: 7px;
  border: 2px solid var(--ink);
  border-radius: 11px;
  background: #fffdf7;
  box-shadow: 0 2px 0 var(--ink);
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-soft);
}
.about-stats b { display: block; font-size: 16px; color: var(--ink); }

/* ----------------------------------------------------------------- toast -- */

.toast {
  position: fixed;
  z-index: 90;
  left: 50%;
  bottom: 98px;
  transform: translateX(-50%) translateY(10px);
  max-width: calc(100vw - 32px);
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--ink);
  color: #fffdf7;
  box-shadow: 0 10px 24px rgba(43, 38, 56, .28);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s cubic-bezier(.2, 1.3, .4, 1);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* -------------------------------------------------------------- confetti -- */

.confetti {
  position: fixed;
  inset: 0;
  z-index: 70;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* --------------------------------------------------------------- loading -- */

.loading-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 18px;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .8), transparent 44%),
    linear-gradient(180deg, #bfe9ff, #e8f8ff 55%, #fff6e6);
  transition: opacity .38s ease, visibility .38s;
}
.loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-card {
  width: min(400px, calc(100vw - 36px));
  padding: 26px 26px 20px;
  text-align: center;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 28px;
  box-shadow: var(--shadow-card);
  animation: pop-in .5s cubic-bezier(.2, 1.3, .4, 1) both;
}
.loading-mascot svg {
  width: 112px;
  height: 112px;
  animation: mascot-float 2.6s ease-in-out infinite;
  filter: drop-shadow(0 8px 8px rgba(43, 38, 56, .16));
}
.loading-card h2 { margin: 6px 0 0; font-size: 19px; font-weight: 900; }
.loading-card > p { margin: 8px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-soft); font-weight: 700; }
.loading-track {
  height: 14px;
  margin: 17px auto 9px;
  border: 2.5px solid var(--ink);
  border-radius: 99px;
  background: #fff;
  box-shadow: inset 0 2px 3px rgba(120, 90, 50, .15);
  overflow: hidden;
}
.loading-track i {
  display: block;
  width: 0%;
  height: 100%;
  background: repeating-linear-gradient(45deg, #ffd166 0 8px, #ffb703 8px 16px);
  border-radius: 99px;
  transition: width .25s ease;
}
.loading-foot { font-size: 9.5px !important; opacity: .6; margin-top: 4px !important; }

.loading-card.error { border-color: var(--coral-deep); }
.loading-card.error h2 { color: var(--coral-deep); }
.loading-card.error .loading-track { display: none; }
.loading-card .error-detail {
  max-height: 110px;
  overflow: auto;
  margin: 12px 0 0;
  padding: 8px;
  border-radius: 9px;
  background: rgba(43, 38, 56, .06);
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-soft);
  text-align: left;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ------------------------------------------------------------- animations -- */

@keyframes cloud-drift {
  from { transform: translateX(0) scale(var(--s, 1)); }
  to   { transform: translateX(calc(100vw + 420px)) scale(var(--s, 1)); }
}
@keyframes sun-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.045); }
}
@keyframes twinkle {
  0%, 100% { opacity: .25; transform: scale(.75) rotate(0deg); }
  50%      { opacity: .9;  transform: scale(1.15) rotate(20deg); }
}
@keyframes rise-in {
  from { opacity: 0; transform: translateY(16px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
@keyframes pop-in {
  from { opacity: 0; transform: scale(.9) translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@keyframes mascot-float {
  0%, 100% { transform: translateY(0) rotate(-.6deg); }
  50%      { transform: translateY(-8px) rotate(.8deg); }
}
@keyframes mascot-think {
  0%, 100% { transform: translateY(0) rotate(-2.4deg); }
  50%      { transform: translateY(-4px) rotate(2.4deg); }
}
@keyframes mascot-hop {
  0%, 100% { transform: translateY(0) scale(1); }
  40%      { transform: translateY(-13px) scale(1.03, .97); }
  70%      { transform: translateY(0) scale(.98, 1.02); }
}
@keyframes mascot-sad {
  0%, 100% { transform: translateY(2px) rotate(-2deg); }
  50%      { transform: translateY(5px) rotate(1deg); }
}
@keyframes tear-drop {
  0%, 15%   { opacity: 0; transform: translateY(-3px) scale(.7); }
  35%       { opacity: 1; }
  80%       { opacity: .9; transform: translateY(16px) scale(1); }
  100%      { opacity: 0; transform: translateY(22px) scale(.9); }
}
@keyframes glow-breathe {
  0%, 100% { opacity: .7; transform: scale(.96); }
  50%      { opacity: 1;  transform: scale(1.06); }
}
@keyframes blink {
  0%, 43%, 49%, 100% { transform: scaleY(1); }
  45%, 47%           { transform: scaleY(.08); }
}
@keyframes eye-look {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px) scaleY(.92); }
}
@keyframes antenna-glow {
  0%, 100% { opacity: 0; transform: scale(.75); }
  50%      { opacity: .85; transform: scale(1.08); }
}
@keyframes speech-pop {
  0%   { transform: scale(.96) translateY(3px); }
  60%  { transform: scale(1.015) translateY(-1px); }
  100% { transform: none; }
}
@keyframes stone-drop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
  60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@keyframes last-pulse {
  0%, 100% { opacity: .95; transform: scale(1); }
  50%      { opacity: .45; transform: scale(1.07); }
}
@keyframes draw-line {
  from { stroke-dashoffset: 1; }
  to   { stroke-dashoffset: 0; }
}
@keyframes dot-bounce {
  0%, 70%, 100% { transform: translateY(0); opacity: .45; }
  35%           { transform: translateY(-4px); opacity: 1; }
}
@keyframes pill-pop {
  0%   { transform: scale(.86); }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes banner-in {
  from { opacity: 0; transform: translateX(-50%) translateY(24px) scale(.94); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

/* ---------------------------------------------------------------- responsive */

@media (max-width: 1100px) {
  .game-shell { grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; }
  .board-shell { width: min(700px, calc(100vw - 470px), 72vh); }
}

@media (max-width: 920px) {
  .game-shell {
    grid-template-columns: minmax(0, 1fr);
    gap: 18px;
    padding-bottom: 26px;
  }
  .board-card { margin: 0 auto; }
  .board-shell { width: min(700px, calc(100vw - 88px), 74vh); }
  .side { width: 100%; max-width: 620px; margin: 0 auto; }
  .mascot-card { display: grid; grid-template-columns: 1.1fr .9fr; grid-template-rows: auto auto auto; column-gap: 12px; align-items: center; }
  .speech { grid-column: 1 / -1; }
  .mascot-stage { grid-column: 2; grid-row: 2 / 4; height: 176px; margin-top: 0; }

  const cellEls = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

  /* ------------------------------------------------------------------ audio */

  function ensureAudio() {
    if (!state.sound || !audioUnlocked) return;
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {
      audioCtx = null;
    }
  }

  const SOUNDS = {
    tap:    [{ f: 620, d: 0.045, type: 'sine', g: 0.035 }],
    place:  [{ f: 430, d: 0.07, type: 'sine', g: 0.05 }, { f: 210, d: 0.1, type: 'triangle', g: 0.04, delay: 0.02 }],
    engine: [{ f: 260, d: 0.09, type: 'triangle', g: 0.055 }, { f: 150, d: 0.12, type: 'sine', g: 0.04, delay: 0.03 }],
    undo:   [{ f: 660, d: 0.07, type: 'sine', g: 0.035 }, { f: 440, d: 0.07, type: 'sine', g: 0.035, delay: 0.06 }, { f: 300, d: 0.1, type: 'sine', g: 0.035, delay: 0.12 }],
    win:    [{ f: 523, d: 0.13, type: 'triangle', g: 0.06 }, { f: 659, d: 0.13, type: 'triangle', g: 0.06, delay: 0.12 }, { f: 784, d: 0.15, type: 'triangle', g: 0.06, delay: 0.24 }, { f: 1047, d: 0.28, type: 'triangle', g: 0.055, delay: 0.38 }],
    lose:   [{ f: 392, d: 0.16, type: 'sine', g: 0.05 }, { f: 330, d: 0.16, type: 'sine', g: 0.05, delay: 0.14 }, { f: 262, d: 0.26, type: 'sine', g: 0.05, delay: 0.28 }],
    draw:   [{ f: 440, d: 0.14, type: 'sine', g: 0.04 }, { f: 440, d: 0.2, type: 'sine', g: 0.04, delay: 0.2 }],
  };

  function playSound(name) {
    if (!state.sound) return;
    ensureAudio();
    if (!audioCtx) return;
    const notes = SOUNDS[name] || SOUNDS.tap;
    try {
      const base = audioCtx.currentTime;
      for (const note of notes) {
        const start = base + (note.delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = note.type || 'sine';
        osc.frequency.setValueAtTime(note.f, start);
        if (note.f2) osc.frequency.exponentialRampToValueAtTime(note.f2, start + note.d);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(note.g || 0.04, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + note.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + note.d + 0.03);
      }
    } catch (_) { /* audio is optional */ }
  }

  function updateSoundButton() {
    document.body.classList.toggle('muted', !state.sound);
    els.soundBtn.setAttribute('aria-label', state.sound ? '关闭音效' : '开启音效');
    els.soundBtn.title = state.sound ? '关闭音效' : '开启音效';
  }

  function toggleSound() {
    state.sound = !state.sound;
    saveBool(STORAGE.sound, state.sound);
    updateSoundButton();
    if (state.sound) {
      audioUnlocked = true;
      ensureAudio();
      toast('音效已开启');
    } else {
      toast('音效已关闭');
    }
  }

  /* --------------------------------------------------------------- storage */

  function loadBool(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      if (v === null) return fallback;
      return v === '1';
    } catch (_) { return fallback; }
  }

  function saveBool(key, value) {
    try { localStorage.setItem(key, value ? '1' : '0'); } catch (_) {}
  }

  function loadLevel() {
    try {
      const v = localStorage.getItem(STORAGE.level);
      return LEVELS[v] ? v : 'normal';
    } catch (_) { return 'normal'; }
  }

  function loadSound() {
    const v = loadBool(STORAGE.sound, true);
    return v;
  }

  function loadScore() {
    try {
      const raw = localStorage.getItem(STORAGE.score);
      if (!raw) return { you: 0, engine: 0, draws: 0 };
      const parsed = JSON.parse(raw);
      return {
        you: Number.isFinite(parsed.you) ? parsed.you : 0,
        engine: Number.isFinite(parsed.engine) ? parsed.engine : 0,
        draws: Number.isFinite(parsed.draws) ? parsed.draws : 0,
      };
    } catch (_) {
      return { you: 0, engine: 0, draws: 0 };
    }
  }

  function saveScore() {
    try { localStorage.setItem(STORAGE.score, JSON.stringify(state.score)); } catch (_) {}
  }

  /* --------------------------------------------------------------- engine -- */

  function decodeEngineSource() {
    const b64 = window.__TERMINATOR_ENGINE_B64__ || '';
    if (!b64) throw new Error('缺少引擎数据（engine.js base64）');
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  /* 把每次引擎交互的完整原始输出打进浏览器控制台，便于核对算杀结果。 */
  function logEngineExchange(id, cmdText, msg, elapsedMs) {
    if (!window.console || typeof console.groupCollapsed !== 'function') return;
    const oneline = String(cmdText || '').replace(/\n/g, ' ; ');
    console.groupCollapsed(
      `%c[engine #%d]%c ${oneline} · ${msg.ms}ms (round-trip ${Math.round(elapsedMs)}ms)`,
      'color:#6cb6ff;font-weight:bold', id, 'color:inherit;font-weight:normal',
    );
    console.log(`commands:\n${cmdText || '(none)'}`);
    console.log(`output:\n${msg.text || '(empty)'}`);
    console.groupEnd();
  }

  class EngineRunner {
    constructor() {
      this.worker = null;
      this.ready = false;
      this.seq = 0;
      this.pending = new Map();
      this.readyResolve = null;
      this.readyReject = null;
      this.readyPromise = new Promise((resolve, reject) => {
        this.readyResolve = resolve;
        this.readyReject = reject;
      });
    }

    async start() {
      const engineJs = decodeEngineSource();
      const workerSrc = window.__TERMINATOR_WORKER_SRC__;
      if (!workerSrc) throw new Error('缺少 Web Worker 源码');
      const workerUrl = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
      this.worker = new Worker(workerUrl);
      this.worker.onmessage = (event) => this.onMessage(event.data);
      this.worker.onerror = (event) => {
        this.fail(event && event.message ? event.message : 'Web Worker 加载失败');
      };
      this.worker.postMessage({ type: 'init', engineJs });
      await this.readyPromise;
    }

    fail(message) {
      if (!this.ready) {
        this.ready = true;
        try { this.readyReject(new Error(message)); } catch (_) {}
      }
      this.ready = false;
      for (const pending of this.pending.values()) {
        try { pending.reject(new Error(message)); } catch (_) {}
      }
      this.pending.clear();
      if (typeof window.__onEngineFatal === 'function') window.__onEngineFatal(message);
    }

    onMessage(msg) {
      if (!msg) return;
      if (msg.type === 'ready') {
        this.ready = true;
        try { this.readyResolve(); } catch (_) {}
        return;
      }
      if (msg.type === 'fatal') {
        this.fail(msg.error || '引擎运行时出错');
        return;
      }
      if (msg.type === 'result') {
        const pending = this.pending.get(msg.id);
        if (pending) {
          this.pending.delete(msg.id);
          pending.resolve(msg);
        }
      }
    }

    run(commands) {
      if (!this.ready || !this.worker) return Promise.reject(new Error('引擎尚未就绪'));
      const text = Array.isArray(commands) ? commands.join('\n') : String(commands);
      const started = performance.now();
      return new Promise((resolve, reject) => {
        const id = ++this.seq;
        this.pending.set(id, {
          resolve: (msg) => {
            logEngineExchange(id, text, msg, performance.now() - started);
            resolve(msg);
          },
          reject: (err) => {
            console.error(`[engine #${id}] ${text.replace(/\n/g, ' ; ')} · 失败：${err && err.message ? err.message : err}`);
            reject(err);
          },
        });
        this.worker.postMessage({ type: 'run', id, text });
        setTimeout(() => {
          if (this.pending.delete(id)) {
            const err = new Error('引擎响应超时');
            console.error(`[engine #${id}] ${text.replace(/\n/g, ' ; ')} · ${err.message}`);
            reject(err);
          }
        }, 120000);
      });
    }

    terminate() {
      if (this.worker) {
        this.worker.terminate();
        this.worker = null;
      }
    }
  }

  const engine = new EngineRunner();

  /* ----------------------------------------------------------- speech/util -- */

  function pickLine(lines) {
    if (!lines || !lines.length) return '';
    let choice = lines[Math.floor(Math.random() * lines.length)];
    if (lines.length > 1 && choice === lastSpeech) {
      choice = lines[(lines.indexOf(choice) + 1) % lines.length];
    }
    lastSpeech = choice;
    return choice;
  }

  function speak(textOrLines) {
    const lines = Array.isArray(textOrLines) ? textOrLines : [textOrLines];
    const text = pickLine(lines.filter(Boolean));
    if (!text) return;
    lastSpeech = text;
    els.speech.textContent = text;
    els.speech.classList.remove('pop');
    void els.speech.offsetWidth;
    els.speech.classList.add('pop');
    setTimeout(() => els.speech.classList.remove('pop'), 340);
  }

  function setMascot(mode) {
    const classes = ['thinking', 'happy', 'sad'];
    els.mascotStage.classList.remove(...classes);
    if (mode && classes.includes(mode)) els.mascotStage.classList.add(mode);
  }

  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2300);
  }

  function setSource(source, ms, mate, key) {
    const meta = SOURCE_META[source] || SOURCE_META.search;
    state.source = source;
    els.sourcePill.textContent = meta.label;
    els.sourcePill.dataset.source = source;
    els.sourcePill.classList.remove('pulse');
    void els.sourcePill.offsetWidth;
    els.sourcePill.classList.add('pulse');

    let detail = meta.detail;
    if (key && (source === 'booktree' || source === 'book')) {
      detail += ` #${key.slice(-6)}`;
    }
    if (mate && (source === 'vcf' || source === 'vct')) {
      detail = `${mate} 手杀 · ` + detail;
    }
    els.lastDetail.textContent = detail;
    if (typeof ms === 'number' && ms >= 0) {
      els.lastTime.textContent = ms < 1000 ? `${Math.max(0, Math.round(ms))} ms` : `${(ms / 1000).toFixed(1)} s`;
    } else {
      els.lastTime.textContent = '';
    }
  }

  /* --------------------------------------------------------------- board --- */

  function buildBoard() {
    els.colLabels.innerHTML = COLS.split('').map((c) => `<span>${c}</span>`).join('');
    els.rowLabels.innerHTML = Array.from({ length: SIZE }, (_, i) => `<span>${SIZE - i}</span>`).join('');

    let lines = '';
    for (let i = 0; i < SIZE; i += 1) {
      const p = ((i + 0.5) / SIZE) * 100;
      lines += `<i class="gl v" style="left:${p.toFixed(4)}%"></i>`;
      lines += `<i class="gl h" style="top:${p.toFixed(4)}%"></i>`;
    }
    els.gridLines.innerHTML = lines;

    const stars = [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]];
    els.starLayer.innerHTML = stars.map(([x, y]) => {
      const left = ((x + 0.5) / SIZE) * 100;
      const top = ((y + 0.5) / SIZE) * 100;
      return `<i class="star" style="left:${left.toFixed(4)}%;top:${top.toFixed(4)}%"></i>`;
    }).join('');

    let cells = '';
    for (let y = 0; y < SIZE; y += 1) {
      for (let x = 0; x < SIZE; x += 1) {
        cells += `<button class="cell" type="button" data-x="${x}" data-y="${y}" role="gridcell" tabindex="${x === 0 && y === 0 ? 0 : -1}" aria-label="${notation(x, y)} 空位"></button>`;
      }
    }
    els.cellLayer.innerHTML = cells;

    for (let y = 0; y < SIZE; y += 1) {
      for (let x = 0; x < SIZE; x += 1) {
        cellEls[y][x] = els.cellLayer.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
      }
    }
  }

  function makeStone(x, y, color, animate) {
    const el = document.createElement('div');
    el.className = `stone ${color === 1 ? 'black' : 'white'}${animate ? ' new' : ''}`;
    el.dataset.x = String(x);
    el.dataset.y = String(y);
    el.dataset.xy = `${x}-${y}`;
    el.style.left = `${((x + 0.5) / SIZE) * 100}%`;
    el.style.top = `${((y + 0.5) / SIZE) * 100}%`;
    el.setAttribute('aria-hidden', 'true');
    return el;
  }

  function setCellStone(x, y, color) {
    const cell = cellEls[y][x];
    if (!cell) return;
    cell.classList.add('occupied');
    cell.setAttribute('aria-label', `${notation(x, y)} ${color === 1 ? '黑棋' : '白棋'}`);
  }

  function resetCells() {
    for (let y = 0; y < SIZE; y += 1) {
      for (let x = 0; x < SIZE; x += 1) {
        const cell = cellEls[y][x];
        if (!cell) continue;
        cell.classList.remove('occupied');
        cell.setAttribute('aria-label', `${notation(x, y)} 空位`);
      }
    }
  }

  function updateLastMarker() {
    for (const el of els.stoneLayer.children) el.classList.remove('last');
    if (!state.moves.length) return;
    const last = state.moves[state.moves.length - 1];
    const el = els.stoneLayer.querySelector(`.stone[data-xy="${last.x}-${last.y}"]`);
    if (el) el.classList.add('last');
  }

  function markWinning(line) {
    for (const el of els.stoneLayer.children) el.classList.remove('winning');
    if (!line) return;
    for (const p of line) {
      const el = els.stoneLayer.querySelector(`.stone[data-xy="${p.x}-${p.y}"]`);
      if (el) el.classList.add('winning');
    }
  }

  function renderWinLine(line) {
    if (!line || line.length < 2) {
      els.winLayer.classList.remove('show');
      return;
    }
    const first = line[0];
    const last = line[line.length - 1];
    els.winLine.setAttribute('x1', String(first.x + 0.5));
    els.winLine.setAttribute('y1', String(first.y + 0.5));
    els.winLine.setAttribute('x2', String(last.x + 0.5));
    els.winLine.setAttribute('y2', String(last.y + 0.5));
    els.winLayer.classList.remove('show');
    void els.winLine.getBoundingClientRect();
    els.winLayer.classList.add('show');
  }

  function rebuildStones(animateLast = false) {
    els.stoneLayer.textContent = '';
    state.moves.forEach((m, i) => {
      const el = makeStone(m.x, m.y, m.c, animateLast && i === state.moves.length - 1);
      if (state.winLine && state.winLine.some((p) => p.x === m.x && p.y === m.y)) el.classList.add('winning');
      els.stoneLayer.appendChild(el);
    });
    updateLastMarker();
  }

  function rebuildBoard() {
    resetCells();
    for (const m of state.moves) setCellStone(m.x, m.y, m.c);
    rebuildStones(false);
    renderWinLine(state.winLine);
  }

  function findWinLine(x, y, color) {
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (const [dx, dy] of dirs) {
      const cells = [{ x, y }];
      for (const s of [-1, 1]) {
        let nx = x + s * dx;
        let ny = y + s * dy;
        while (inBounds(nx, ny) && state.board[idx(nx, ny)] === color) {
          if (s < 0) cells.unshift({ x: nx, y: ny });
          else cells.push({ x: nx, y: ny });
          nx += s * dx;
          ny += s * dy;
        }
      }
      if (cells.length >= 5) return cells;
    }
    return null;
  }

  /* ----------------------------------------------------------- game flow --- */

  function appendMove(x, y, color, meta) {
    const p = idx(x, y);
    if (state.board[p] !== 0) return { ok: false, ended: false };
    state.board[p] = color;
    const move = { x, y, c: color, ...(meta || {}) };
    state.moves.push(move);
    const el = makeStone(x, y, color, true);
    els.stoneLayer.appendChild(el);
    setCellStone(x, y, color);
    updateLastMarker();
    updateLog();
    updateStats();

    const line = findWinLine(x, y, color);
    if (line) {
      endGame(color === 1 ? 'engine' : 'you', line, 'five');
      return { ok: true, ended: true };
    }
    if (state.moves.length === CELLS) {
      endGame('draw', null, 'full');
      return { ok: true, ended: true };
    }
    return { ok: true, ended: false };
  }

  function parseEngine(text, opts = {}) {
    const raw = String(text || '');
    const opening = !!opts.opening;
    const lines = raw.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    let move = null;
    for (const line of lines) {
      const match = /^(\d{1,2}),(\d{1,2})$/.exec(line);
      if (match) {
        const x = Number(match[1]);
        const y = Number(match[2]);
        if (inBounds(x, y)) move = { x, y };
      }
    }

    let source = 'search';
    if (/MESSAGE BOOKTREE\b/.test(raw)) source = 'booktree';
    else if (/MESSAGE SUPPLEMENT\b/.test(raw)) source = 'book';
    else if (/MESSAGE BOOK\s+[0-9a-f]/i.test(raw)) source = 'book';
    else if (/tactic=plan\b/.test(raw)) source = 'plan';
    else if (/tactic=immediate-five\b/.test(raw)) source = 'five';
    else if (/tactic=block-opponent-five\b/.test(raw)) source = 'block';
    else if (/MESSAGE SEARCH VCF ok\b/.test(raw)) source = 'vcf';
    else if (/MESSAGE SEARCH VCT ok\b/.test(raw)) source = 'vct';
    else if (/fallback reason=centre-out\b/.test(raw)) source = opening ? 'center' : 'fallback';
    else if (/MESSAGE SEARCH fallback\b/.test(raw)) source = 'fallback';
    else if (/book miss\b/.test(raw)) source = 'search';

    const keyMatch = /MESSAGE (?:BOOKTREE|BOOK) ([0-9a-f]{16})/i.exec(raw);
    const mateMatch = /MESSAGE PROOF (?:VCF|VCT) \+M(\d+)/.exec(raw);
    const timeMatch = /time=(\d+)ms/.exec(raw);

    return {
      move,
      source,
      key: keyMatch ? keyMatch[1] : null,
      mate: mateMatch ? Number(mateMatch[1]) : null,
      time: timeMatch ? Number(timeMatch[1]) : null,
      text: raw,
    };
  }

  function speakForEngine(parsed) {
    if (parsed.source === 'vcf' || parsed.source === 'vct') {
      if (parsed.mate) {
        speak(`算到 ${parsed.mate} 手杀啦！`);
        return;
      }
    }
    const lines = SPEECH[parsed.source];
    if (lines) speak(lines);
    else speak(SPEECH.fallback);
  }

  function handleEngineMove(res) {
    const parsed = parseEngine(res.text, { opening: state.moves.length === 0 });
    const ms = parsed.time !== null ? parsed.time : res.ms;
    if (!parsed.move) {
      setBusy(false);
      showFatal(`小终没有给出着法。\n\n${res.text || '(empty output)'}`);
      return;
    }
    const { x, y } = parsed.move;
    if (!inBounds(x, y) || state.board[idx(x, y)] !== 0) {
      setBusy(false);
      showFatal(`小终给出了非法着法：${x},${y}`);
      return;
    }

    state.lastMs = ms;
    recordSource(parsed.source);
    const result = appendMove(x, y, 1, { source: parsed.source, ms, key: parsed.key, mate: parsed.mate });
    setSource(parsed.source, ms, parsed.mate, parsed.key);

    if (!result.ended) {
      state.turn = 'w';
      state.phase = 'human';
      setMascot('neutral');
      speakForEngine(parsed);
      playSound('engine');
    }
    setBusy(false);
    updateAll();
    flushConfigIfNeeded();
  }

  async function beginNewGame({ initial = false } = {}) {
    if (!initial && state.busy) return;
    state.gameId += 1;
    resetGameState();
    state.phase = 'engine';
    state.turn = 'b';
    setSource('thinking');
    setMascot('thinking');
    speak(initial ? SPEECH.newGame[0] : SPEECH.newGame);
    setBusy(true);
    updateAll();

    const gid = state.gameId;
    try {
      const [res] = await Promise.all([
        engine.run(['START 15', 'BEGIN']),
        delay(initial ? 700 : 460),
      ]);
      if (gid !== state.gameId) return;
      handleEngineMove(res);
    } catch (err) {
      showFatal(err && err.message ? err.message : String(err));
    }
  }

  async function askNewGame() {
    if (state.phase === 'loading' || state.phase === 'error') {
      toast('小终还没准备好呢…');
      return;
    }
    if (state.busy) {
      toast('等小终下完这一步～');
      return;
    }
    if (state.moves.length > 0 && !state.result) {
      const ok = await confirmDialog({
        title: '重新摆一盘？',
        body: '当前棋局会消失，战绩不会变哦。',
        confirmText: '重新开始',
        cancelText: '继续下',
      });
      if (!ok) return;
    }
    hideResultBanner();
    await beginNewGame();
  }

  function humanPlay(x, y) {
    if (state.phase !== 'human' || state.busy || state.result) return;
    if (!inBounds(x, y)) return;
    if (state.board[idx(x, y)] !== 0) {
      toast('这里已经有棋子啦～');
      return;
    }
    ensureAudio();
    playSound('place');
    setSource('human', null, null, null);
    const result = appendMove(x, y, 2, { source: 'human' });
    if (result.ended) return;

    state.turn = 'b';
    state.phase = 'engine';
    speak(SPEECH.think);
    setSource('thinking');
    setMascot('thinking');
    setBusy(true);
    updateAll();
    runTurn(x, y);
  }

  async function runTurn(x, y) {
    const gid = state.gameId;
    try {
      const [res] = await Promise.all([
        engine.run(`TURN ${x},${y}`),
        delay(430),
      ]);
      if (gid !== state.gameId) return;
      handleEngineMove(res);
    } catch (err) {
      showFatal(err && err.message ? err.message : String(err));
    }
  }

  async function undoFlow() {
    if (state.phase === 'loading' || state.phase === 'error') return;
    if (state.busy) {
      toast('等小终下完这一步再悔棋～');
      return;
    }
    if (state.phase === 'over' || state.result) {
      toast('这局已经结束啦，点「再来一局」吧～');
      return;
    }
    let keep = -1;
    for (let i = state.moves.length - 1; i >= 0; i -= 1) {
      if (state.moves[i].c === 2) { keep = i; break; }
    }
    if (keep < 0) {
      toast('你还没落子呢～');
      return;
    }

    const remaining = state.moves.slice(0, keep);
    state.moves = remaining;
    state.board.fill(0);
    for (const m of remaining) state.board[idx(m.x, m.y)] = m.c;
    state.winLine = null;
    state.turn = 'w';
    state.phase = 'human';
    rebuildBoard();
    updateLog();
    recomputeStats();
    setSource('thinking');
    setMascot('thinking');
    speak(SPEECH.undo);
    setBusy(true);
    updateAll();

    try {
      await Promise.all([
        engine.run(`EMPOS ${formatPosition(remaining)}`),
        delay(280),
      ]);
      setBusy(false);
      setMascot('neutral');
      setSource('idle');
      els.lastDetail.textContent = '已回到你上一手之前';
      els.lastTime.textContent = '';
      speak(SPEECH.rewind);
      playSound('undo');
      updateAll();
    } catch (err) {
      showFatal(err && err.message ? err.message : String(err));
    }
  }

  async function resignFlow() {
    if (state.phase === 'loading' || state.phase === 'error') return;
    if (state.busy) {
      toast('等小终下完这一步～');
      return;
    }
    if (state.phase === 'over' || state.result) return;
    const ok = await confirmDialog({
      title: '要认输吗？',
      body: '小终会把这一胜记到本机战绩里。',
      confirmText: '认输',
      cancelText: '再战',
      danger: true,
    });
    if (!ok) return;
    endGame('engine', null, 'resign');
  }

  function formatPosition(moves) {
    const black = [];
    const white = [];
    for (const m of moves) {
      (m.c === 1 ? black : white).push(`${m.x},${m.y}`);
    }
    return `B ${black.join(' ')} W ${white.join(' ')}`;
  }

  function endGame(winner, line, reason) {
    if (state.result) return;
    state.result = { winner, reason };
    state.winLine = line || null;
    state.phase = 'over';
    state.busy = false;
    if (state.thinkTimer) {
      clearInterval(state.thinkTimer);
      state.thinkTimer = null;
    }
    els.mascotStage.classList.remove('thinking');

    if (!state.resultRecorded) {
      state.resultRecorded = true;
      if (winner === 'you') state.score.you += 1;
      else if (winner === 'engine') state.score.engine += 1;
      else state.score.draws += 1;
      saveScore();
    }
    updateScoreDisplay();

    renderWinLine(state.winLine);
    markWinning(state.winLine);
    updateTurnUI();
    updateStatus();
    updateControls();

    if (winner === 'you') {
      setMascot('sad');
      speak(SPEECH.win);
      playSound('win');
      burstConfetti();
    } else if (winner === 'engine') {
      setMascot('happy');
      speak(reason === 'resign' ? SPEECH.resign : SPEECH.lose);
      playSound(reason === 'resign' ? 'draw' : 'lose');
    } else {
      setMascot('neutral');
      speak(SPEECH.draw);
      playSound('draw');
    }

    showResultBanner(winner, reason);
    updateAll();
  }

  function resetGameState() {
    state.board.fill(0);
    state.moves = [];
    state.turn = 'b';
    state.busy = false;
    state.result = null;
    state.winLine = null;
    state.stats = { book: 0, search: 0 };
    state.source = 'idle';
    state.lastMs = 0;
    state.resultRecorded = false;
    if (state.thinkTimer) {
      clearInterval(state.thinkTimer);
      state.thinkTimer = null;
    }
    els.stoneLayer.textContent = '';
    els.winLayer.classList.remove('show');
    resetCells();
    setMascot('neutral');
    hideResultBanner();
    updateLog();
    updateStats();
    updateScoreDisplay();
    updateTurnUI();
    updateControls();
    setSource('idle');
  }

  /* --------------------------------------------------------------- status -- */

  function setBusy(busy) {
    state.busy = busy;
    if (busy) {
      state.thinkStart = performance.now();
      if (state.thinkTimer) clearInterval(state.thinkTimer);
      state.thinkTimer = setInterval(() => {
        if (!state.busy) return;
        const seconds = (performance.now() - state.thinkStart) / 1000;
        els.statusSub.textContent = `已思考 ${seconds.toFixed(1)}s · ${LEVELS[state.level].label}档`;
      }, 110);
      els.mascotStage.classList.add('thinking');
    } else {
      if (state.thinkTimer) {
        clearInterval(state.thinkTimer);
        state.thinkTimer = null;
      }
      els.mascotStage.classList.remove('thinking');
    }
    updateTurnUI();
    updateStatus();
    updateControls();
  }

  function updateStats() {
    els.moveCount.textContent = String(state.moves.length);
    els.bookHits.textContent = String(state.stats.book);
    els.searchHits.textContent = String(state.stats.search);
  }

  function recordSource(source) {
    if (source === 'booktree' || source === 'book' || source === 'plan') state.stats.book += 1;
    else state.stats.search += 1;
  }

  function recomputeStats() {
    state.stats = { book: 0, search: 0 };
    for (const move of state.moves) {
      if (move.c !== 1) continue;
      if (move.source === 'booktree' || move.source === 'book' || move.source === 'plan') state.stats.book += 1;
      else state.stats.search += 1;
    }
    updateStats();
  }

  function updateLog() {
    if (!state.moves.length) {
      els.moveLog.innerHTML = '<div class="log-empty">还空着呢，等小终先落子～</div>';
      els.logMeta.textContent = '0 手';
      return;
    }
    const rows = [];
    for (let i = 0; i < state.moves.length; i += 2) {
      const black = state.moves[i];
      const white = state.moves[i + 1];
      const bSource = black && black.source ? black.source : '';
      const bClass = bSource === 'booktree' || bSource === 'book' || bSource === 'plan'
        ? 'book'
        : (bSource === 'vcf' || bSource === 'vct' ? 'calc' : 'search');
      rows.push(
        '<div class="log-row">'
        + `<span class="idx">${i / 2 + 1}</span>`
        + `<span class="log-move black" title="${escapeHtml(SOURCE_META[bSource] ? SOURCE_META[bSource].label : '黑棋')}"><i class="dot"></i>${notation(black.x, black.y)}${bSource && bSource !== 'human' ? `<i class="src-dot ${bClass}"></i>` : ''}</span>`
        + (white
          ? `<span class="log-move white" title="白棋"><i class="dot"></i>${notation(white.x, white.y)}</span>`
          : '<span class="log-move"></span>')
        + '</div>',
      );
    }
    els.moveLog.innerHTML = rows.join('');
    els.logMeta.textContent = `${state.moves.length} 手`;
    els.moveLog.scrollTop = els.moveLog.scrollHeight;
  }

  function roundNumber() {
    return Math.floor(state.moves.length / 2) + 1;
  }

  function updateStatus() {
    if (state.phase === 'loading') {
      els.statusText.textContent = '小终正在热身…';
      els.statusSub.textContent = '首次加载可能需要几秒';
      return;
    }
    if (state.phase === 'error') {
      els.statusText.textContent = '引擎休息中';
      els.statusSub.textContent = '刷新页面再试一次';
      return;
    }
    if (state.result) {
      const winner = state.result.winner;
      if (winner === 'you') {
        els.statusText.textContent = '你赢啦！';
        els.statusSub.textContent = '小终回去补谱了…';
      } else if (winner === 'engine') {
        els.statusText.textContent = '小终赢啦';
        els.statusSub.textContent = state.result.reason === 'resign' ? '你认输了 · 再来一局？' : '黑棋必胜，不是说说而已';
      } else {
        els.statusText.textContent = '握手言和';
        els.statusSub.textContent = '棋盘满啦，这局平手';
      }
      return;
    }
    if (state.busy) {
      els.statusText.innerHTML = '小终思考中<span class="thinking-dots"><i></i><i></i><i></i></span>';
      const seconds = state.thinkStart ? (performance.now() - state.thinkStart) / 1000 : 0;
      els.statusSub.textContent = `已思考 ${seconds.toFixed(1)}s · ${LEVELS[state.level].label}档`;
      return;
    }
    if (state.turn === 'w') {
      els.statusText.textContent = '轮到你啦';
      els.statusSub.textContent = `第 ${roundNumber()} 手 · 点击格点落子`;
    } else {
      els.statusText.textContent = '小终落子';
      els.statusSub.textContent = '正在准备下一步…';
    }
  }

  function updateTurnUI() {
    const over = Boolean(state.result) || state.phase === 'over' || state.phase === 'error';
    const busy = state.busy;
    els.board.dataset.turn = state.turn;
    els.board.classList.toggle('busy', busy);
    els.board.classList.toggle('over', over);

    let youActive = false;
    let cpuActive = false;
    if (state.result) {
      youActive = state.result.winner === 'you';
      cpuActive = state.result.winner === 'engine';
    } else if (busy || state.phase === 'engine' || state.phase === 'loading') {
      cpuActive = true;
    } else if (state.phase === 'human') {
      youActive = true;
    }
    els.youChip.classList.toggle('active', youActive);
    els.cpuChip.classList.toggle('active', cpuActive);
  }

  function updateControls() {
    const locked = state.phase === 'loading' || state.phase === 'error';
    els.newGameBtn.disabled = locked || state.busy;
    els.resignBtn.disabled = locked || state.busy || state.phase === 'over' || Boolean(state.result) || state.moves.length === 0;
    const hasWhite = state.moves.some((m) => m.c === 2);
    els.undoBtn.disabled = locked || state.busy || state.phase === 'over' || Boolean(state.result) || !hasWhite;
    for (const btn of $$('.segmented button')) btn.disabled = locked;
  }

  function updateAll() {
    updateTurnUI();
    updateStatus();
    updateControls();
    updateStats();
    updateScoreDisplay();
  }

  function updateScoreDisplay() {
    els.scoreYou.textContent = String(state.score.you);
    els.scoreCpu.textContent = String(state.score.engine);
  }

  /* --------------------------------------------------------------- level --- */

  function updateLevelUI() {
    const info = LEVELS[state.level];
    els.diffHint.textContent = info.hint;
    for (const btn of $$('.segmented button')) {
      const on = btn.dataset.level === state.level;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function configCommands() {
    const opts = LEVELS[state.level].opts;
    return Object.entries(opts).map(([key, value]) => `EMOPT ${key} ${value}`);
  }

  async function applyConfig() {
    if (state.phase === 'loading' || state.phase === 'error') return;
    if (state.busy) {
      state.configDirty = true;
      return;
    }
    try {
      await engine.run(configCommands());
      state.configDirty = false;
    } catch (_) {
      toast('设置没来得及生效，但还能继续下～');
    }
  }

  function flushConfigIfNeeded() {
    if (!state.configDirty || state.busy) return;
    state.configDirty = false;
    engine.run(configCommands()).catch(() => toast('设置没来得及生效～'));
  }

  function setLevel(level) {
    if (!LEVELS[level] || level === state.level) return;
    state.level = level;
    try { localStorage.setItem(STORAGE.level, level); } catch (_) {}
    updateLevelUI();
    const info = LEVELS[level];
    speak(info.speech);
    if (state.phase === 'loading' || state.phase === 'error') return;
    if (state.busy) {
      state.configDirty = true;
      toast(`下一手开始「${info.label}」模式`);
    } else {
      applyConfig();
      toast(`小终进入「${info.label}」模式`);
    }
  }

  /* --------------------------------------------------------------- modal --- */

  function openModal({ title, body, actions, onAction, onCancel }) {
    if (!els.modalBackdrop.hidden) closeModal(true);
    modalState = {
      onAction: onAction || null,
      onCancel: onCancel || null,
      lastFocus: document.activeElement,
    };
    els.modalBody.innerHTML = `
      <h2 id="modalTitle">${title}</h2>
      <div class="modal-copy">${body}</div>
      <div class="modal-actions">
        ${(actions || []).map((a) => `<button class="btn ${a.kind || ''} ${a.small ? 'small' : ''}" type="button" data-action="${a.action}">${a.label}</button>`).join('')}
      </div>`;
    els.modalBackdrop.hidden = false;
    void els.modalBackdrop.offsetWidth;
    els.modalBackdrop.classList.add('show');
    setTimeout(() => {
      const first = els.modalBody.querySelector('[data-action]');
      if (first) first.focus();
    }, 60);
  }

  function closeModal(instant = false) {
    const current = modalState;
    modalState = { onAction: null, onCancel: null, lastFocus: current.lastFocus };
    els.modalBackdrop.classList.remove('show');
    if (instant) {
      els.modalBackdrop.hidden = true;
      els.modalBody.innerHTML = '';
    } else {
      setTimeout(() => {
        if (!els.modalBackdrop.classList.contains('show')) {
          els.modalBackdrop.hidden = true;
          els.modalBody.innerHTML = '';
        }
      }, 200);
    }
    if (current.onCancel) {
      try { current.onCancel(); } catch (_) {}
    }
    if (current.lastFocus && typeof current.lastFocus.focus === 'function') {
      setTimeout(() => current.lastFocus.focus(), 220);
    }
  }

  function confirmDialog({ title, body, confirmText, cancelText, danger }) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (value) => {
        if (settled) return;
        settled = true;
        closeModal();
        resolve(value);
      };
      openModal({
        title,
        body,
        actions: [
          { label: cancelText || '再想想', action: 'cancel', kind: 'ghost' },
          { label: confirmText || '确定', action: 'ok', kind: danger ? 'danger' : 'primary' },
        ],
        onAction: (action) => {
          if (action === 'ok') finish(true);
          else if (action === 'cancel') finish(false);
        },
        onCancel: () => finish(false),
      });
    });
  }

  function aboutStatsHtml() {
    return `
      <span><b>${state.score.you}</b>你赢</span>
      <span><b>${state.score.engine}</b>小终赢</span>
      <span><b>${state.score.draws}</b>和棋</span>`;
  }

          if (stats) stats.innerHTML = aboutStatsHtml();
